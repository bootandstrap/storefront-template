# ─── Per-Client Docker Compose (Template) ──────────────────
# Generated by provision-client.sh
# Usage: docker compose up -d
# ────────────────────────────────────────────────────────────

services:
  storefront:
    build:
      context: ../../
      dockerfile: apps/storefront/Dockerfile
    container_name: storefront-${CLIENT_SLUG}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000" # Available only to the attached reverse-proxy network
    depends_on:
      medusa:
        condition: service_healthy
    networks:
      - client-net

  medusa:
    build:
      context: ../../
      dockerfile: apps/medusa/Dockerfile
    container_name: medusa-${CLIENT_SLUG}
    restart: unless-stopped
    env_file: .env
    expose:
      - "9000" # Internal only
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - client-net

  redis:
    image: redis:7-alpine
    container_name: redis-${CLIENT_SLUG}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - client-net

volumes:
  redis-data:


networks:
  client-net:
    driver: bridge
