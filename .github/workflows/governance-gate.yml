# Governance Quality Gate
# Ensures platform integrity by running governance consistency checks,
# Sentrux architectural checks, and template drift detection on every PR.
#
# This catches:
#   - Contract↔code drift (schemas, defaults, feature-gate)
#   - Module registry inconsistencies
#   - Shared package export alignment
#   - Architectural boundary violations
#   - Template drift between tenant repos and source
#
# @locked 🔴 PLATFORM — Do not customize per tenant.

name: Governance Quality Gate

on:
  workflow_dispatch:
    inputs:
      assurance_only:
        description: Run only sealed read-only full assurance for this exact revision
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - 'apps/storefront/e2e/**'
      - 'apps/storefront/src/lib/bns-360/**'
      - 'apps/storefront/src/lib/__tests__/bns-360-e2e-matrix.test.ts'
      - 'apps/storefront/src/lib/governance-contract.json'
      - 'apps/medusa/src/**'
      - '.github/workflows/governance-gate.yml'

permissions:
  contents: read

concurrency:
  group: governance-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-package-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.assurance_only
    name: "📦 Shared Package Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bootandstrap/shared build

      - name: Run shared package tests
        run: pnpm --filter @bootandstrap/shared test

  governance-drift:
    if: github.event_name != 'workflow_dispatch' || !inputs.assurance_only
    name: "🏛️ Governance Drift Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: shared-package-tests
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical BOOTANDSTRAP_WEB
        uses: actions/checkout@v4
        with:
          repository: bootandstrap/bootandstrap-web
          token: ${{ secrets.BSWEB_READ_TOKEN || github.token }}
          ssh-key: ${{ secrets.BSWEB_READ_KEY }}
          path: BOOTANDSTRAP_WEB

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract drift detection
        run: |
          echo "📜 Checking governance contract alignment..."
          # Run shared tests that validate contract structure
          pnpm --filter @bootandstrap/shared test -- --reporter=verbose 2>&1 | tail -20

      - name: Template drift check
        run: |
          echo "🔍 Checking template drift..."
          npx tsx scripts/template-drift-check.ts || true
          echo "✅ Template drift check complete"

      - name: Admin/Owner CRUD Contract Tests
        run: |
          echo "🔐 Running Admin/Owner CRUD contract tests..."
          cd apps/storefront
          npx vitest run src/lib/__tests__/admin-owner-crud-contract.test.ts
        env:
          BSWEB_ROOT: ${{ github.workspace }}/BOOTANDSTRAP_WEB
          NODE_OPTIONS: --max-old-space-size=4096

  architecture-gate:
    if: github.event_name != 'workflow_dispatch' || !inputs.assurance_only
    name: "🏛️ Architecture Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Sentrux
        run: |
          curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sentrux architecture check
        run: sentrux gate .

  medusa-typecheck:
    if: github.event_name != 'workflow_dispatch' || !inputs.assurance_only
    name: "⚡ Medusa Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (Medusa)
        run: |
          cd apps/medusa
          npx tsc --noEmit --skipLibCheck 2>&1 | tail -30
          echo "✅ Medusa TypeScript check complete"
        continue-on-error: true  # Non-blocking for now (Medusa types can be noisy)

  local-assurance:
    if: github.event_name == 'workflow_dispatch' && inputs.assurance_only
    name: "Read-only Full Assurance"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision without credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.9.15'
          enable-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter=storefront exec playwright install --with-deps chromium

      - name: Run uncached full assurance
        run: pnpm assurance:full -- --no-cache
        env:
          CI: ''
          BNS_ASSURANCE_WORKERS: '2'

      - name: Verify exact assurance evidence
        run: node scripts/verify-ci-assurance-evidence.mjs

      - name: Upload exact assurance evidence
        uses: actions/upload-artifact@v7
        with:
          name: assurance-full-${{ github.sha }}
          path: |
            .artifacts/assurance/
            apps/storefront/test-results/
            apps/storefront/playwright-report/
          if-no-files-found: error
          retention-days: 14

  summary:
    name: "📊 Gate Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [shared-package-tests, governance-drift, architecture-gate, medusa-typecheck]
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs.assurance_only)
    steps:
      - name: Report
        run: |
          echo "## 🏛️ Governance Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Shared Package Tests | ${{ needs.shared-package-tests.result == 'success' && '✅' || '❌' }} ${{ needs.shared-package-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Governance Drift | ${{ needs.governance-drift.result == 'success' && '✅' || '⚠️' }} ${{ needs.governance-drift.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture Quality | ${{ needs.architecture-gate.result == 'success' && '✅' || '⚠️' }} ${{ needs.architecture-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Medusa Type Check | ${{ needs.medusa-typecheck.result == 'success' && '✅' || '⚠️' }} ${{ needs.medusa-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
